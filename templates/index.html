<!doctype html>
<!-- docflow portal — generic, project-agnostic. Reads INDEX.md for nav, renders any
     doc client-side. No build. Serve (fetch needs http): python3 -m http.server --directory <this dir> -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocFlow portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 8h14v3H9zm0 6h14v3H9zm0 6h10v3H9z' fill='white'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-theme">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e2e6ec;
    --text: #111827;
    --text-2: #374151;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --accent-border: #bfdbfe;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --ok-border: #a7f3d0;
    --shadow: 0 2px 8px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
    --radius: 8px;
    --side-w: 300px;
    --topbar-h: 54px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
    height: 100vh;
    overflow: hidden;
  }

  /* ── Mobile top bar (hidden on desktop) ─────────────── */
  #topbar {
    display: none;
    position: fixed;
    inset: 0 0 auto 0;
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 200;
  }

  #menu-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    cursor: pointer;
    flex-shrink: 0;
    transition: background .12s;
  }

  #menu-btn:hover { background: var(--surface-2); }

  #topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* ── Sidebar ──────────────────────────────────────────── */
  #side {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  #side-header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand-logo svg { flex-shrink: 0; }

  .brand-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.01em;
  }

  .brand-tagline {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.3;
    margin-top: 1px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--ok);
    background: var(--ok-soft);
    border: 1px solid var(--ok-border);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .search-wrap { position: relative; }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #q {
    width: 100%;
    padding: 8px 10px 8px 32px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }

  #q::placeholder { color: var(--muted); }

  #q:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #side-nav {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 16px;
  }

  #side-nav::-webkit-scrollbar { width: 4px; }
  #side-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .grp-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    padding: 16px 8px 5px;
  }

  a.doc {
    display: block;
    padding: 7px 9px;
    border-radius: 6px;
    color: var(--text-2);
    text-decoration: none;
    cursor: pointer;
    transition: background .1s;
    margin-bottom: 1px;
  }

  a.doc:hover { background: var(--surface-2); }
  a.doc.active { background: var(--accent-soft); }
  a.doc.active .doc-name { color: var(--accent); }
  a.doc.active .doc-desc { color: #93b4fd; }

  .doc-name {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .doc-desc {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  /* ── Overlay backdrop (mobile) ───────────────────────── */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 150;
    opacity: 0;
    transition: opacity .22s;
  }

  #overlay.visible { opacity: 1; }

  /* ── Main ─────────────────────────────────────────────── */
  #main {
    overflow: auto;
    padding: 32px 40px;
    background: var(--bg);
  }

  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .doc-card {
    max-width: 860px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 36px 40px;
  }

  /* table scroll wrapper */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 16px 0;
  }

  .table-wrap table { margin: 0; }

  /* Typography */
  .doc-card h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.02em;
    color: var(--text);
    margin-bottom: 20px;
  }

  .doc-card h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin: 32px 0 10px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    letter-spacing: -.01em;
  }

  .doc-card h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-2);
    margin: 22px 0 8px;
  }

  .doc-card h4 {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .doc-card p { margin: 10px 0; color: var(--text-2); }

  .doc-card ul, .doc-card ol {
    padding-left: 22px;
    margin: 8px 0;
    color: var(--text-2);
  }

  .doc-card li { margin: 4px 0; }

  .doc-card a { color: var(--accent); text-decoration: none; }
  .doc-card a:hover { text-decoration: underline; }

  .doc-card hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  .doc-card blockquote {
    border-left: 3px solid var(--accent-border);
    padding: 10px 16px;
    background: var(--accent-soft);
    border-radius: 0 6px 6px 0;
    margin: 14px 0;
    color: var(--text-2);
  }

  /* Tables */
  .doc-card table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13.5px;
    min-width: 380px;
  }

  .doc-card th, .doc-card td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    vertical-align: top;
    text-align: left;
  }

  .doc-card th {
    background: var(--surface-2);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }

  .doc-card tr:hover td { background: #fafbfc; }

  /* Inline code */
  .doc-card code {
    font-family: "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 12.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    color: #c0392b;
  }

  /* Code blocks */
  .code-block-wrap { position: relative; margin: 16px 0; }

  .code-lang {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #64748b;
    pointer-events: none;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 10px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 5px;
    color: #94a3b8;
    cursor: pointer;
    transition: background .15s, color .15s;
    font-family: inherit;
  }

  .copy-btn:hover { background: rgba(255,255,255,.18); color: #e2e8f0; }
  .copy-btn.copied { color: #4ade80; border-color: rgba(74,222,128,.3); }

  .doc-card pre {
    background: #0f172a;
    border-radius: 8px;
    overflow-x: auto;
    padding: 44px 16px 16px;
    margin: 0;
  }

  .doc-card pre.no-lang { padding-top: 16px; }

  .doc-card pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 13px;
    line-height: 1.6;
    border-radius: 0;
  }

  .hint { color: var(--muted); font-size: 13.5px; }

  /* ── Tablet (900px) ──────────────────────────────────── */
  @media (max-width: 900px) {
    :root { --side-w: 240px; }
    #main { padding: 24px 28px; }
    .doc-card { padding: 28px 28px; }
  }

  /* ── Mobile (640px) — drawer + topbar ───────────────── */
  @media (max-width: 640px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
      overflow: hidden;
    }

    #topbar { display: flex; }

    /* sidebar becomes fixed slide-in drawer */
    #side {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(280px, 82vw);
      z-index: 160;
      transform: translateX(-105%);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
    }

    #side.open {
      transform: translateX(0);
      box-shadow: 4px 0 24px rgba(0,0,0,.14);
    }

    #overlay { display: block; }

    /* main sits in grid row 2 (below topbar) */
    #main { padding: 18px 14px; }

    .doc-card { padding: 20px 16px; border-radius: 8px; }
    .doc-card h1 { font-size: 22px; }
    .doc-card h2 { font-size: 16px; }
  }

  /* ── Very small (400px) ──────────────────────────────── */
  @media (max-width: 400px) {
    .doc-card { padding: 16px 12px; }
    #main { padding: 12px 10px; }
  }
</style>
</head>
<body>

<!-- Mobile top bar -->
<header id="topbar">
  <button id="menu-btn" aria-label="Open navigation">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>
  <span id="topbar-title">DocFlow</span>
</header>

<!-- Sidebar -->
<nav id="side">
  <div id="side-header">
    <div class="brand">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#2563eb"/>
          <path d="M9 8h14v3H9zm0 6h14v3H9zm0 6h10v3H9z" fill="white"/>
        </svg>
        <div>
          <div class="brand-name">DocFlow</div>
          <div class="brand-tagline">Project docs &amp; living memory</div>
        </div>
      </div>
      <span class="badge" id="count">0 docs</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="q" placeholder="Filter docs…" autocomplete="off" spellcheck="false" />
    </div>
  </div>
  <div id="side-nav"></div>
</nav>

<!-- Backdrop -->
<div id="overlay"></div>

<!-- Content -->
<main id="main">
  <div class="doc-card"><p class="hint">Loading…</p></div>
</main>

<script>
const main     = document.getElementById('main');
const nav      = document.getElementById('side-nav');
const sidebar  = document.getElementById('side');
const overlay  = document.getElementById('overlay');
const menuBtn  = document.getElementById('menu-btn');
const topTitle = document.getElementById('topbar-title');
const q        = document.getElementById('q');
const count    = document.getElementById('count');
let entries = [];

// ── Drawer ───────────────────────────────────────────────
function openDrawer() {
  sidebar.classList.add('open');
  overlay.classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
  document.body.style.overflow = '';
}

menuBtn.onclick = openDrawer;
overlay.onclick = closeDrawer;

// ── Data ─────────────────────────────────────────────────
async function fetchText(p) {
  const r = await fetch(p);
  if (!r.ok) throw new Error(r.status + ' ' + p);
  return r.text();
}

function parseIndex(txt) {
  return txt.split('\n')
    .map(l => l.trim())
    .filter(l => l && !l.startsWith('#') && !l.startsWith('<!--'))
    .map(l => {
      const i = l.indexOf(' — ');
      return i < 0 ? null : { path: l.slice(0, i).trim(), desc: l.slice(i + 3).trim() };
    })
    .filter(Boolean);
}

function group(list) {
  const g = {};
  for (const e of list) {
    const k = e.path.includes('/') ? e.path.split('/')[0] : '(root)';
    (g[k] = g[k] || []).push(e);
  }
  return g;
}

function renderNav(filter = '') {
  const f = filter.toLowerCase();
  const list = entries.filter(e => (e.path + ' ' + e.desc).toLowerCase().includes(f));
  const g = group(list);
  nav.innerHTML = '';
  count.textContent = list.length + (list.length === 1 ? ' doc' : ' docs');
  for (const k of Object.keys(g).sort()) {
    const h = document.createElement('div');
    h.className = 'grp-label';
    h.textContent = k;
    nav.appendChild(h);
    for (const e of g[k]) {
      const a = document.createElement('a');
      a.className = 'doc';
      a.onclick = () => load(e.path);
      a.dataset.path = e.path;
      a.innerHTML =
        '<div class="doc-name">' + e.path.split('/').pop() + '</div>' +
        '<div class="doc-desc">' + e.desc + '</div>';
      nav.appendChild(a);
    }
  }
}

// ── Code blocks ──────────────────────────────────────────
function wrapCodeBlocks() {
  main.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;
    const langClass = [...code.classList].find(c => c.startsWith('language-'));
    const lang = langClass ? langClass.replace('language-', '') : '';
    if (lang && hljs.getLanguage(lang)) hljs.highlightElement(code);
    else { hljs.highlightElement(code); if (!lang) pre.classList.add('no-lang'); }
    const wrap = document.createElement('div');
    wrap.className = 'code-block-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    if (lang) {
      const label = document.createElement('span');
      label.className = 'code-lang';
      label.textContent = lang;
      wrap.appendChild(label);
    }
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = 'copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1800);
      });
    };
    wrap.appendChild(btn);
  });
}

// ── Tables: wrap for horizontal scroll ───────────────────
function wrapTables() {
  main.querySelectorAll('.doc-card table').forEach(t => {
    if (t.closest('.table-wrap')) return;
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
}

// ── Load doc ─────────────────────────────────────────────
async function load(path) {
  try {
    const md = await fetchText(path);
    main.innerHTML = '<div class="doc-card">' + marked.parse(md) + '</div>';
    wrapCodeBlocks();
    wrapTables();
    nav.querySelectorAll('a.doc').forEach(a => a.classList.toggle('active', a.dataset.path === path));
    topTitle.textContent = path.split('/').pop().replace(/\.md$/, '');
    main.querySelectorAll('a[href]').forEach(a => {
      let href = a.getAttribute('href');
      if (/^https?:|^#|^mailto:/.test(href)) return;
      href = decodeURI(href).replace(/^<|>$/, '').split('#')[0];
      if (!href.endsWith('.md')) return;
      const base = path.includes('/') ? path.replace(/[^/]+$/, '') : '';
      const target = new URL(base + href, location.origin + '/').pathname.replace(/^\//, '');
      a.onclick = ev => { ev.preventDefault(); load(target); };
    });
    main.scrollTop = 0;
    closeDrawer();
  } catch (e) {
    main.innerHTML =
      '<div class="doc-card"><p class="hint">Cannot load <code>' + path + '</code> — ' + e.message +
      '<br><br>Serve over http: <code>python3 -m http.server --directory .</code></p></div>';
    closeDrawer();
  }
}

// ── Keyboard shortcuts ────────────────────────────────────
document.addEventListener('keydown', ev => {
  if ((ev.key === 'k' && (ev.metaKey || ev.ctrlKey)) || (ev.key === '/' && document.activeElement !== q)) {
    ev.preventDefault(); q.focus(); q.select();
  }
  if (ev.key === 'Escape') {
    if (document.activeElement === q) q.blur();
    else closeDrawer();
  }
});

// ── Init ──────────────────────────────────────────────────
(async () => {
  try { entries = parseIndex(await fetchText('INDEX.md')); }
  catch { entries = [{ path: 'README.md', desc: 'Docs index' }]; }
  renderNav();
  load(entries.find(e => /README\.md$/.test(e.path))?.path || entries[0]?.path || 'README.md');
})();

q.oninput = () => renderNav(q.value);
</script>
</body>
</html>
