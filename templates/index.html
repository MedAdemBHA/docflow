<!doctype html>
<!-- docflow portal — generic, project-agnostic. Reads INDEX.md for nav, renders any
     doc client-side. No build. Serve (fetch needs http): python3 -m http.server --directory <this dir> -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocFlow portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 8h14v3H9zm0 6h14v3H9zm0 6h10v3H9z' fill='white'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#f0f3f6;
    --border:#d8dee7;
    --text:#1f2933;
    --muted:#64748b;
    --accent:#2563eb;
    --accent-soft:#e8f0ff;
    --ok:#0f766e;
    --shadow:0 1px 2px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:var(--bg);
    display:grid;
    grid-template-columns:340px minmax(0,1fr);
    height:100vh;
  }
  #side {
    border-right:1px solid var(--border);
    background:var(--surface);
    overflow:auto;
    padding:18px 16px;
  }
  .brand { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .brand h1 { font-size:16px; line-height:1.2; margin:0; }
  .brand p { color:var(--muted); margin:4px 0 0; font-size:12px; line-height:1.35; }
  .count { color:var(--ok); background:#e6f4f1; border:1px solid #bfe3dc; border-radius:999px; padding:2px 8px; font-size:12px; white-space:nowrap; }
  #q {
    width:100%;
    min-height:38px;
    padding:8px 10px;
    margin-bottom:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    outline:none;
  }
  #q:focus { border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft); }
  .grp {
    color:var(--muted);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.06em;
    margin:18px 0 6px;
    font-weight:700;
  }
  a.doc {
    display:block;
    padding:8px 9px;
    border:1px solid transparent;
    border-radius:8px;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
  }
  a.doc:hover { background:var(--accent-soft); border-color:#c7d7fe; }
  a.doc.active { background:var(--accent-soft); border-color:#9bbcff; }
  a.doc strong { display:block; font-size:13px; line-height:1.25; overflow-wrap:anywhere; }
  a.doc small { color:var(--muted); display:block; margin-top:3px; line-height:1.35; overflow-wrap:anywhere; }
  #main {
    overflow:auto;
    padding:34px 48px;
  }
  .doc-wrap {
    max-width:980px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:var(--shadow);
    padding:26px 30px;
  }
  #main pre { background:#0f172a; color:#e5e7eb; padding:14px; border-radius:8px; overflow:auto; }
  #main code { background:var(--surface-2); padding:1px 5px; border-radius:5px; }
  #main pre code { background:transparent; color:inherit; padding:0; }
  #main table { border-collapse:collapse; width:100%; margin:14px 0; }
  #main th,#main td { border:1px solid var(--border); padding:7px 10px; vertical-align:top; }
  #main th { background:var(--surface-2); text-align:left; }
  #main a { color:var(--accent); }
  #main h1 { font-size:28px; line-height:1.2; margin:0 0 18px; }
  #main h2 { border-top:1px solid var(--border); padding-top:18px; margin-top:28px; }
  #main h3 { margin-top:22px; }
  .hint { color:var(--muted); }
  @media (max-width:820px) {
    body { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
    #side { border-right:0; border-bottom:1px solid var(--border); max-height:42vh; }
    #main { padding:18px; }
    .doc-wrap { padding:20px; }
  }
</style>
</head>
<body>
<nav id="side">
  <div class="brand">
    <div>
      <h1>DocFlow</h1>
      <p>Project docs, commands, plans, and shipped history.</p>
    </div>
    <span class="count" id="count">0 docs</span>
  </div>
  <input id="q" placeholder="Filter docs and commands" />
  <div id="nav"></div>
</nav>
<main id="main"><div class="doc-wrap"><p class="hint">Loading...</p></div></main>
<script>
const main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q'), count = document.getElementById('count');
let entries = [];

async function fetchText(p){ const r = await fetch(p); if(!r.ok) throw new Error(r.status+' '+p); return r.text(); }

function parseIndex(txt){
  return txt.split('\n')
    .map(l => l.trim())
    .filter(l => l && !l.startsWith('#') && !l.startsWith('<!--'))
    .map(l => { const i = l.indexOf(' — '); return i<0 ? null : { path:l.slice(0,i).trim(), desc:l.slice(i+3).trim() }; })
    .filter(Boolean);
}

function group(list){
  const g = {};
  for (const e of list){ const k = e.path.includes('/') ? e.path.split('/')[0] : '(root)'; (g[k]=g[k]||[]).push(e); }
  return g;
}

function renderNav(filter=''){
  const f = filter.toLowerCase();
  const list = entries.filter(e => (e.path+' '+e.desc).toLowerCase().includes(f));
  const g = group(list); nav.innerHTML = '';
  count.textContent = list.length + (list.length === 1 ? ' doc' : ' docs');
  for (const k of Object.keys(g).sort()){
    const h = document.createElement('div'); h.className='grp'; h.textContent=k; nav.appendChild(h);
    for (const e of g[k]){
      const a = document.createElement('a'); a.className='doc'; a.onclick=()=>load(e.path);
      a.dataset.path = e.path;
      a.innerHTML = '<strong>'+e.path.split('/').pop()+'</strong><small>'+e.desc+'</small>';
      nav.appendChild(a);
    }
  }
}

async function load(path){
  try {
    const md = await fetchText(path);
    main.innerHTML = '<div class="doc-wrap">'+marked.parse(md)+'</div>';
    nav.querySelectorAll('a.doc').forEach(a => a.classList.toggle('active', a.dataset.path === path));
    // rewrite relative .md links to load in-portal
    main.querySelectorAll('a[href]').forEach(a => {
      let href = a.getAttribute('href');
      if (/^https?:|^#|^mailto:/.test(href)) return;
      href = decodeURI(href).replace(/^<|>$/g,'').split('#')[0];
      if (!href.endsWith('.md')) return;
      const base = path.includes('/') ? path.replace(/[^/]+$/,'') : '';
      const target = new URL(base+href, location.origin+'/').pathname.replace(/^\//,'');
      a.onclick = ev => { ev.preventDefault(); load(target); };
    });
    main.scrollTop = 0;
  } catch(e){ main.innerHTML = '<div class="doc-wrap"><p class="hint">Cannot load '+path+' - '+e.message+'<br>Serve over http: <code>python3 -m http.server --directory .</code></p></div>'; }
}

(async () => {
  try { entries = parseIndex(await fetchText('INDEX.md')); }
  catch { entries = [{path:'README.md',desc:'Docs index'}]; }
  renderNav();
  load(entries.find(e=>/README\.md$/.test(e.path))?.path || entries[0]?.path || 'README.md');
})();
q.oninput = () => renderNav(q.value);
</script>
</body>
</html>
